<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = window.localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (error) {
          /* localStorage indisponível (modo privado/iframe): mantém o padrão escuro */
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      html { background-color: #08080f; }
      html[data-theme='light'] { background-color: #ececf3; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Infográfico interativo sobre a cultura DevOps, seus princípios fundamentais e as três maneiras: fluxo, feedback e aprendizado contínuo."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236d4aff'/%3E%3Ctext x='50' y='70' font-size='60' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'%3E3%3C/text%3E%3C/svg%3E"
    />
    <title>Cultura DevOps e as Três Maneiras — Infográfico Interativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
